<script>
(() => {
  const modal = document.getElementById('ventureModal');
  const actions = modal?.querySelector('.dialog-actions');
  const primary = document.getElementById('dialogLink');

  if (!modal || !actions || !primary) return;

  primary.removeAttribute('data-i');

  let social = document.getElementById('dialogSocial');

  if (!social) {
    social = document.createElement('a');
    social.id = 'dialogSocial';
    social.className = 'btn btn-social';
    social.target = '_blank';
    social.rel = 'noopener noreferrer';
    actions.insertBefore(social, actions.lastElementChild);
  }

  const css = document.createElement('style');

  css.textContent = `
    .dialog-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
      margin-top: 23px;
    }

    .dialog-actions .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 10px 12px;
      text-align: center;
      white-space: normal;
      line-height: 1.5;
      font-size: 11px;
      border-radius: 14px;
    }

    .btn-social {
      background: linear-gradient(135deg, #163851, #0d2539);
      color: #c4ebff;
      border: 1px solid #427e9d;
    }

    .btn-social:hover {
      background: #173c58;
    }

    @media (max-width: 550px) {
      .dialog-actions {
        grid-template-columns: 1fr;
      }

      .dialog-actions .btn {
        min-height: 49px;
      }
    }
  `;

  document.head.appendChild(css);

  const routes = {
    geo: {
      website: 'https://geo-precision.vercel.app/',
      social: links.geo,
      platform: 'Instagram'
    },

    brand: {
      social: links.brand,
      platform: 'Instagram',
      extra: links.brandTikTok,
      extraPlatform: 'TikTok'
    },

    startup: {
      social: links.startup,
      platform: 'Instagram',
      extra: links.wa,
      extraPlatform: 'WhatsApp'
    },

    lunou: {
      social: links.lunou,
      platform: 'Instagram',
      extra: links.wa,
      extraPlatform: 'WhatsApp'
    },

    neuro: {
      website: 'https://www.visioncode-studio.com/neurova/landing',
      social: links.linkedin,
      platform: 'LinkedIn',
      founder: true
    },

    sol: {
      social: links.linkedin,
      platform: 'LinkedIn',
      founder: true,
      extra: links.wa,
      extraPlatform: 'WhatsApp'
    }
  };

  const labels = {
    ar: {
      site: 'زيارة الموقع الإلكتروني ↗',
      page: 'صفحة المشروع على',
      founder: 'ملف المؤسس على',
      contact: 'تواصل عبر'
    },

    en: {
      site: 'Visit website ↗',
      page: 'Project on',
      founder: 'Founder on',
      contact: 'Contact via'
    },

    fr: {
      site: 'Visiter le site web ↗',
      page: 'Projet sur',
      founder: 'Fondateur sur',
      contact: 'Contacter via'
    }
  };

  function buttonText(platform, founder = false) {
    const l = labels[current] || labels.ar;

    if (platform === 'WhatsApp') {
      return `${l.contact} WhatsApp ↗`;
    }

    return `${founder ? l.founder : l.page} ${platform} ↗`;
  }

  window.fillVenture = function(id) {
    const v = ventures[id];
    const r = routes[id];

    if (!v || !r) return;

    modal.dataset.current = id;

    document.getElementById('dialogLogo').src = v.logo;
    document.getElementById('dialogLogo').alt = v.name;
    document.getElementById('dialogTitle').textContent = v.name;
    document.getElementById('dialogCategory').textContent = v.category;
    document.getElementById('dialogDescription').textContent = v.desc[current];

    // First button: real website or social fallback
    primary.href = r.website || r.social || links.wa;

    primary.textContent = r.website
      ? labels[current].site
      : buttonText(r.platform || 'WhatsApp', !!r.founder);

    // Second button: social or another contact channel
    social.href = r.website
      ? (r.social || links.linkedin)
      : (r.extra || links.wa);

    social.textContent = r.website
      ? buttonText(r.platform || 'LinkedIn', !!r.founder)
      : buttonText(r.extraPlatform || 'WhatsApp');
  };

  // Update Quick Access links too
  const geoHub = hubItems.find(
    item => item[0] === 'GeoPrecision Studio'
  );

  if (geoHub) {
    geoHub[2] = 'https://geo-precision.vercel.app/';
  }

  if (!hubItems.some(item => item[0] === 'Neurova')) {
    hubItems.push([
      'Neurova',
      'AI & Medical Imaging',
      'https://www.visioncode-studio.com/neurova/landing'
    ]);
  }
})();
</script>
